name: Delete merged branch

# Deletes the head branch after a pull request merges into dev.
# GitHub then retargets any stacked PRs that were based on it to dev.

on:
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete head branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["dev","next","main"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Delete ${{ github.event.pull_request.head.ref }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" \
            || echo "Branch $BRANCH was already deleted."
