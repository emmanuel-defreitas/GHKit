name: Docs

# Builds the DocC documentation for GHKit and GHKitUI with Scripts/build_docs.sh.
# Pull requests build it as a check, so broken doc links fail. Pushes to main (each release)
# publish it to GitHub Pages at https://<owner>.github.io/GHKit/documentation/.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  # Let a running deployment finish; only superseded PR builds are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build documentation
        env:
          # "View source" links point at the exact commit the docs were built from.
          DOCS_SOURCE_REF: ${{ github.sha }}
          DOCS_BASE_PATH: ${{ github.event.repository.name }}
        run: Scripts/build_docs.sh _site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
