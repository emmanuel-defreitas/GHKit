name: CI

on:
  pull_request:
  push:
    branches: [dev, next, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: swift format
        run: swift format lint --strict --recursive Sources Tests Package.swift

  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for iOS
        run: |
          xcodebuild -scheme GHKit-Package \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            build -quiet
